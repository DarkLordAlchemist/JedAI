name: Bug report
description: Something in JedAI doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    value: |
      Thanks for the report.

      Please search the [open issues](https://github.com/DarkLordAlchemist/JedAI/issues?q=is%3Aissue+state%3Aopen) first — this may already be tracked.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you got, and what you expected instead. Paste the exact error text if there is one. If there's a set of steps or commands that reproduces it, put them here too.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: JedAI version, GPU, OS
      description: The engine version is on the About tab, or in `GET /v1/status` under `engine`.
      placeholder: "llama.cpp-b9301 · RTX 4060 8GB · Windows 11"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Engine log
      description: Drag in `jedai-<model>.log` from your JedAI folder. Drag and drop works directly into this box.
    validations:
      required: false
  - type: markdown
    value: |
      A couple of extras that help a lot:

      - Check the [troubleshooting table](https://github.com/DarkLordAlchemist/JedAI/blob/main/docs/TROUBLESHOOTING.md) first, many reports are already solved there.